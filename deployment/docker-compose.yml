services:
  frontend:
    image: node:20
    container_name: karting-frontend
    working_dir: /workspace
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    environment:
      VITE_API_BASE_URL: /api
      VITE_DEV_API_PROXY_TARGET: http://api:8080
      NPM_CONFIG_CACHE: /tmp/.npm
      HOME: /tmp
    volumes:
      - ../frontend:/workspace
    depends_on:
      api:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-4173}:5173"
    networks:
      - karting-network

  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: karting-api
    working_dir: /workspace/api/src/Karting.Api
    command:
      - sh
      - -c
      - dotnet restore Karting.Api.csproj && dotnet run --no-restore --urls=http://0.0.0.0:${API_INTERNAL_PORT:-8080}
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:${API_INTERNAL_PORT:-8080}
      Database__Provider: SqlServer
      ConnectionStrings__SqlServer: Server=${SQLSERVER_HOST:-sqlserver},${SQLSERVER_PORT:-1433};Database=${SQLSERVER_DB:-KartingRaceManagement};User Id=${SQLSERVER_USER:-sa};Password=${SA_PASSWORD};TrustServerCertificate=True
      ConnectionStrings__Redis: ${REDIS_CONNECTION_STRING:-redis:6379}
    ports:
      - "${API_PORT:-8080}:${API_INTERNAL_PORT:-8080}"
    volumes:
      - ..:/workspace
    depends_on:
      sqlserver:
        condition: service_started
      sql-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - karting-network

  sql-bootstrap:
    image: mcr.microsoft.com/mssql-tools
    container_name: karting-sql-bootstrap
    restart: "no"
    security_opt:
      - apparmor:unconfined
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        SQLCMD="/opt/mssql-tools/bin/sqlcmd"
        until "$$SQLCMD" -S sqlserver -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" -C >/dev/null 2>&1; do
          sleep 2
        done
        "$$SQLCMD" -S sqlserver -U sa -P "$$SA_PASSWORD" -C -i /opt/karting/sql/schema/000-bootstrap-database.sql
        "$$SQLCMD" -S sqlserver -U sa -P "$$SA_PASSWORD" -C -i /opt/karting/sql/schema/010-create-core-tables.sql
        "$$SQLCMD" -S sqlserver -U sa -P "$$SA_PASSWORD" -C -i /opt/karting/sql/stored-procedures/100-create-sp-get-race-results.sql
        "$$SQLCMD" -S sqlserver -U sa -P "$$SA_PASSWORD" -C -i /opt/karting/sql/stored-procedures/110-create-sp-get-fastest-lap.sql
        "$$SQLCMD" -S sqlserver -U sa -P "$$SA_PASSWORD" -C -i /opt/karting/sql/seed/200-seed-sample-data.sql
    depends_on:
      sqlserver:
        condition: service_started
    volumes:
      - ./sql:/opt/karting/sql:ro
    networks:
      - karting-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: karting-sqlserver
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./sql:/opt/karting/sql:ro
    healthcheck:
      disable: true
    networks:
      - karting-network

  redis:
    image: redis:7-alpine
    container_name: karting-redis
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      disable: true
    networks:
      - karting-network

volumes:
  sqlserver-data:
  redis-data:

networks:
  karting-network:
    driver: bridge
