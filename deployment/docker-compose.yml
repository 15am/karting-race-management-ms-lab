services:
  frontend:
    image: node:20
    container_name: karting-frontend
    working_dir: /workspace
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    environment:
      VITE_API_BASE_URL: /api
      VITE_DEV_API_PROXY_TARGET: http://api:8080
      NPM_CONFIG_CACHE: /tmp/.npm
      HOME: /tmp
    volumes:
      - ../frontend:/workspace
    depends_on:
      api:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-4173}:5173"
    networks:
      - karting-network

  api:
    build:
      context: ..
      dockerfile: api/src/Karting.Api/Dockerfile
    container_name: karting-api
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:${API_INTERNAL_PORT:-8080}
      Database__Provider: SqlServer
      ConnectionStrings__SqlServer: Server=${SQLSERVER_HOST:-sqlserver},${SQLSERVER_PORT:-1433};Database=${SQLSERVER_DB:-KartingRaceManagement};User Id=${SQLSERVER_USER:-sa};Password=${SA_PASSWORD};TrustServerCertificate=True
      ConnectionStrings__Redis: ${REDIS_CONNECTION_STRING:-redis:6379}
    ports:
      - "${API_PORT:-8080}:${API_INTERNAL_PORT:-8080}"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - karting-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: karting-sqlserver
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./sql:/opt/karting/sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - karting-network

  redis:
    image: redis:7-alpine
    container_name: karting-redis
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - karting-network

volumes:
  sqlserver-data:
  redis-data:

networks:
  karting-network:
    driver: bridge
